; Воркер очереди портала osmo (patch v34, 23.09.2026): напоминания, уведомления, письма.
; Очереди: database (Remind, уведомления сайта/почты/телеграма, UsersSync) и default.
; После выкатки кода: php artisan queue:restart (воркер перезапустится сам).
[program:osmo_queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/www-root/data/www/osmo-avg.ru/artisan queue:work database --queue=database,default --sleep=3 --tries=3 --max-time=3600
directory=/var/www/www-root/data/www/osmo-avg.ru
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/www-root/data/www/osmo-avg.ru/storage/logs/queue-worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
stopwaitsecs=60
